<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Negeri Sugaria — The Seven Landmark Adventure</title>
  <meta name="description" content="Mini Game Negeri Sugaria — jelajahi tujuh landmark dan selesaikan setiap mini game." />
  
<style>
:root{
  --bg:#07191f;
  --bg2:#0d2d2c;
  --panel:#0a2026;
  --gold:#e9b94b;
  --gold2:#ffd968;
  --cream:#fff0bf;
  --muted:#c9bd98;
  --line:rgba(233,185,75,.34);
  --shadow:0 14px 38px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  font-family:Georgia,"Times New Roman",serif;
  color:var(--cream);
  background:
    radial-gradient(circle at 50% 0%,rgba(75,125,83,.28),transparent 34%),
    linear-gradient(145deg,#06171d 0%,#0b292b 48%,#171520 100%);
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.5;
  background:
    radial-gradient(circle at 18% 22%,rgba(255,215,100,.08) 0 1px,transparent 2px),
    radial-gradient(circle at 78% 68%,rgba(255,215,100,.07) 0 1px,transparent 2px);
  background-size:90px 90px,130px 130px;
}
button,a{font:inherit}
.shell{width:min(1600px,100%);margin:0 auto;padding:14px 18px 28px;position:relative}

/* HEADER */
header{
  position:sticky;
  top:10px;
  z-index:50;
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:18px;
  min-height:78px;
  padding:8px 14px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(6,25,32,.94);
  backdrop-filter:blur(12px);
  box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,217,104,.06);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:190px;height:64px;display:block;object-fit:contain;
  filter:drop-shadow(0 5px 8px rgba(0,0,0,.55));
}
.brand-name{
  color:var(--gold2);font-weight:800;font-size:clamp(18px,1.5vw,25px);
  white-space:nowrap;text-shadow:0 2px 5px #000;
}
nav{
  display:flex;justify-content:center;align-items:center;gap:4px;
  min-width:0;overflow-x:auto;scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav a{
  color:#ffeab0;text-decoration:none;font-weight:800;font-size:14px;
  padding:10px 13px;border-radius:10px;white-space:nowrap;
}
nav a:hover{background:rgba(233,185,75,.12);color:#fff}
.side-stats{
  position:sticky;top:104px;
  border:1px solid var(--line);border-radius:16px;padding:12px;
  background:rgba(7,27,32,.9);box-shadow:var(--shadow);
}
.side-stats-title{
  color:var(--gold2);font-size:12px;font-weight:800;letter-spacing:1px;
  text-align:center;padding:6px 2px 10px;border-bottom:1px solid var(--line);
}
.side-stat{
  display:flex;align-items:center;gap:9px;padding:13px 5px;
  border-bottom:1px solid rgba(233,185,75,.15);
}
.side-stat:last-child{border-bottom:0}
.side-icon{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:#301c43;border:1px solid #d69b35;font-size:17px;flex:0 0 auto;
}
.side-stat strong{display:block;color:var(--gold2);font-size:19px}
.side-stat span{display:block;color:var(--muted);font-size:11px;margin-top:2px}

/* MAP AREA */
.hero{min-width:0}
.map-hero{position:relative;overflow:hidden;border-radius:20px}

.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:1.5px}
.hero h1{margin:7px 0 8px;color:var(--gold2);font-size:clamp(30px,3.5vw,52px);line-height:1.05}
.hero p{margin:0;color:#f4e8c1;font-size:17px;line-height:1.5}


.map-hotspot{
  position:absolute;left:25.8%;top:78.5%;transform:translate(-50%,-50%);
  width:58px;height:58px;border-radius:50%;border:3px solid var(--gold2);
  background:rgba(57,16,17,.94);box-shadow:0 0 0 5px rgba(255,211,92,.18),0 8px 22px rgba(0,0,0,.55);
  font-size:27px;cursor:pointer;transition:.2s;z-index:5;
}
.map-hotspot:hover{transform:translate(-50%,-50%) scale(1.1)}

/* CONTENT BELOW MAP */
.progress-wrap{margin-top:16px}
.panel{
  border:1px solid var(--line);border-radius:16px;
  background:rgba(5,20,25,.86);padding:20px;box-shadow:var(--shadow);
}
.panel h2{margin:0 0 12px;color:var(--gold2);font-size:22px}
.progress-info{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;color:#e8ddba}
.progress{height:12px;background:#172b2e;border-radius:99px;overflow:hidden;border:1px solid #765526}
.progress>div{width:0;height:100%;background:linear-gradient(90deg,#7ed957,#ffd24a);transition:width .35s}
.landmark-section{margin-top:16px}
.landmarks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.landmark{
  position:relative;min-height:150px;padding:17px;border:1px solid #8f672a;border-radius:14px;
  background:linear-gradient(145deg,rgba(28,43,40,.98),rgba(13,27,31,.98));
  cursor:pointer;transition:.2s;
}
.landmark:hover{transform:translateY(-3px);border-color:#e6b43e}
.num{
  display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;
  border-radius:50%;background:#321c45;border:2px solid #d69b35;color:#ffd25a;font-weight:800
}
.landmark h3{margin:11px 0 7px;color:#ffe4a0;font-size:18px;line-height:1.2}
.landmark p{margin:0;color:#cdbf96;font-size:14px;line-height:1.45}
.badge{position:absolute;right:14px;top:15px;color:#ffd34d}
.locked{opacity:.58;cursor:not-allowed}

footer{text-align:center;padding:28px 10px 4px;color:#a99b77;font-size:13px}

/* TABLET */
@media(max-width:1120px){
  header{grid-template-columns:1fr;gap:6px;padding:9px 12px}
  .brand{justify-content:center}
  nav{justify-content:center}
  .side-stats-title{border:0;border-right:1px solid var(--line);padding:6px}
  .side-stat{justify-content:center;border:0}
  .landmarks{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* MOBILE */
@media(max-width:700px){
  .shell{padding:8px 8px 22px}
  header{position:static;border-radius:14px}
  .logo{width:145px;height:52px}
  .brand-name{font-size:18px}
  nav{width:100%;justify-content:flex-start;gap:2px}
  nav a{font-size:12px;padding:8px 10px}

/* V5: status panel beside the map */


.map-stage .map-frame{
  min-width:0;
}
@media (max-width: 900px){
  
  
}


/* V6 responsive landing map */
.map-stage{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  box-sizing:border-box;
  margin:0 auto;
}
.map-stage .map-frame{
  width:100%;
  max-width:1500px;
  min-width:0;
  overflow:hidden;
  box-sizing:border-box;
}
.map-stage .map-frame img{
  display:block;
  width:100%;
  height:auto;
  max-width:100%;
  object-fit:contain;
}
@media (max-width: 900px){
  .map-stage{
    padding:0 10px;
  }
  .map-stage .map-frame{
    width:100%;
    border-radius:14px;
  }
}
@media (max-width: 600px){
  .map-stage{
    padding:0 6px;
  }
}

</style>


<style id="v7-hide-status-stats">
/* V7: landing page has no player status, score, badges, or keys */
.player-status, #player-status, .status-petualang, #status-petualang,
.player-stats, #player-stats, .stats, .score, #score, .badges, #badges,
.keys, #keys, .status-panel, #status-panel {
  display: none !important;
}
</style>


<style id="v8-integrated-map">
/* V8: map is integrated directly into the landing page */
.adventure-layout{
  display:block;
  width:100%;
  margin:0;
  padding:0;
}
.map-hero{
  position:relative;
  width:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
}
.map-frame{
  position:relative;
  width:100%;
  max-width:none !important;
  margin:0;
  padding:0;
  overflow:hidden;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
}
.map-frame img.world-map{
  display:block;
  width:100%;
  max-width:none;
  height:auto;
  margin:0;
  border:0;
  border-radius:0;
  object-fit:cover;
}
@media (max-width:700px){
  .map-frame img.world-map{
    width:100%;
    height:auto;
    object-fit:cover;
  }
}
</style>

</head>
<body>
  <div class="shell">
    <header>
      <!-- Logo baru: menggantikan teks header lama -->
      <div class="brand">
        <img class="logo" src="assets/logo-negeri-sugaria.png" alt="Logo Negeri Sugaria" />
        <div class="brand-name">Negeri Sugaria</div>
      </div>

      <nav aria-label="Navigasi utama">
        <a href="#beranda">⌂ BERANDA</a>
        <a href="#landmarks">🗺 LANDMARKS</a>
        <a href="#petualangan">⚔ ADVENTURE</a>
      </nav>
    </header>

    <main id="beranda">
      <div class="adventure-layout" id="petualangan">
        <section class="hero map-hero" aria-label="Peta Negeri Sugaria">
          <div class="map-frame">
            <img
              src="assets/negeri-sugaria-map.png"
              alt="Peta tujuh landmark Negeri Sugaria"
              class="world-map"
            />
            <button
              class="map-hotspot chocolate-hotspot"
              type="button"
              aria-label="Buka Chocolate Abyss Gate"
              title="Chocolate Abyss Gate"
              onclick="openLandmark(0)"
            >
              🍫
            </button>
          </div>
        </section>
      </div>

      <section class="progress-wrap" id="progress">
        <div class="panel">
          <h2>PROGRESS PETUALANGAN</h2>
          <div class="progress-info">
            <span id="progressText">0 / 7 Landmark Diselesaikan</span>
            <b id="percent">0%</b>
          </div>
          <div class="progress"><div id="progressBar"></div></div>
        </div>
      </section>

      <section class="panel" id="landmarks" style="margin-top:24px">
        <h2>7 LANDMARK NEGERI SUGARIA</h2>
        <div class="landmarks" id="landmarkGrid"></div>
      </section>
    </main>

    <footer>
      © Negeri Sugaria — The Seven Landmark Adventure · Where Every Flavor Belongs
    </footer>
  </div>

  <script>
    // Urutan progres baru sesuai permintaan:
    const landmarks = [
      { name: "Chocolate Abyss Gate", desc: "Maze · Temukan jalan menuju gerbang cokelat.", icon: "🍫" },
      { name: "Blueberry Marketplace", desc: "Transaksi jual-beli · Hitung uang dengan tepat.", icon: "🫐" },
      { name: "Kiwi Greenhouse", desc: "Timbangan & pecahan · Pecahkan tantangan berat.", icon: "🥝" },
      { name: "Grape Chalice Swamp", desc: "Waktu · Tantangan membaca dan menghitung waktu.", icon: "🍇" },
      { name: "Banana Tower", desc: "Pola · Temukan pola dan lanjutkan urutannya.", icon: "🍌" },
      { name: "Citrus Lighthouse", desc: "Bangun 2D → 3D · Susun bentuk menjadi objek.", icon: "🍊" },
      { name: "Gigantic Strawberry Castle", desc: "Harta karun · Gunakan kunci untuk membuka puzzle.", icon: "🍓" }
    ];

    // Nilai awal dapat diganti dengan data game/LocalStorage nantinya.
    const completed = Number(localStorage.getItem("sugariaCompleted") || 0);
    const score = Number(localStorage.getItem("sugariaScore") || 0);
    const badges = Number(localStorage.getItem("sugariaBadges") || 0);
    const keys = Number(localStorage.getItem("sugariaKeys") || 0);
function openLandmark(index) {
      const routes = [
        "games/chocolate-abyss-gate/",
        "blueberry-marketplace/",
        "kiwi-greenhouse/",
        "grape-chalice-swamp/",
        "banana-tower/",
        "citrus-lighthouse/",
        "gigantic-strawberry-castle/"
      ];
      const unlocked = index === 0 || index <= completed;
      if (unlocked) window.location.href = routes[index];
    }

    const grid = document.getElementById("landmarkGrid");
    landmarks.forEach((item, i) => {
      const unlocked = i === 0 || i <= completed;
      const card = document.createElement("article");
      card.className = "landmark" + (unlocked ? "" : " locked");
      card.innerHTML = `
        <span class="num">${i + 1}</span>
        <span class="badge">${unlocked ? "✓" : "🔒"}</span>
        <h3>${item.icon} ${item.name}</h3>
        <p>${item.desc}</p>
      `;
      if (unlocked) {
        card.addEventListener("click", () => {
          openLandmark(i);
        });
      }
      grid.appendChild(card);
    });

    const pct = Math.round((completed / 7) * 100);
    document.getElementById("progressText").textContent = `${completed} / 7 Landmark Diselesaikan`;
    document.getElementById("percent").textContent = `${pct}%`;
    document.getElementById("progressBar").style.width = `${pct}%`;
  </script>
</body>
</html>
